<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storyboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a document program — menu bar on a desk, the board is the page; trackers are rows (roster), steps run left to right, details open in a side panel. */
:root {
  --desk: #e6e9ef;
  --page: #ffffff;
  --ink: #1d2433;
  --muted: #5d6679;
  --line: #d3d8e2;
  --accent: #2c55c9;
  --accent-soft: #e4ebfb;
  --now: #2c55c9;
  --wait: #a2690a;
  --wait-soft: #fbf1dd;
  --bad: #b23b3b;
  --bad-soft: #f8e4e4;
  --good: #23784e;
  --menu: #f6f7fa;
  --l1: #c27c0e; --l2: #2f8f6b; --l3: #7232e0; --l4: #d0145e; --l5: #2a86b8; --l6: #6b7280;
  --p1: #9273b4; --p2: #b06f88; --p3: #6a8aab; --p4: #9c8656; --p5: #55958f;   /* the soft palette: kinds of things, never a signal */
  --shadow: 0 1px 2px rgba(20,30,60,.08), 0 6px 24px rgba(20,30,60,.08);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #12151c; --page: #1b1f29; --ink: #e5e8ef; --muted: #9aa3b5; --line: #323949;
  --accent: #7c9cff; --accent-soft: #263257; --now: #7c9cff; --wait: #e2b04f; --wait-soft: #3a2f17;
  --bad: #ff8a8a; --bad-soft: #3f2225; --good: #6fd19c; --menu: #171b24; --l1: #f0b54d; --l2: #5fd0a2; --l3: #a36bff; --l4: #ff4f98; --l5: #6cc4f2; --l6: #a4acba; --p1: #bea5dc; --p2: #dca2b8; --p3: #9dbbd9; --p4: #cdb688; --p5: #8ac6c0;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 24px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --desk: #12151c; --page: #1b1f29; --ink: #e5e8ef; --muted: #9aa3b5; --line: #323949;
  --accent: #7c9cff; --accent-soft: #263257; --now: #7c9cff; --wait: #e2b04f; --wait-soft: #3a2f17;
  --bad: #ff8a8a; --bad-soft: #3f2225; --good: #6fd19c; --menu: #171b24; --l1: #f0b54d; --l2: #5fd0a2; --l3: #a36bff; --l4: #ff4f98; --l5: #6cc4f2; --l6: #a4acba; --p1: #bea5dc; --p2: #dca2b8; --p3: #9dbbd9; --p4: #cdb688; --p5: #8ac6c0;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 24px rgba(0,0,0,.35); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--desk); color: var(--ink); font: 15px/1.5 var(--f-body); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: flex; flex-direction: column; min-height: 100%; }

/* menu bar */
.menubar { display: flex; align-items: center; gap: 4px; padding: 6px 16px; background: var(--menu); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; flex-wrap: wrap; }
.doc-name { font: 700 15px var(--f-display); margin-right: 12px; display: flex; align-items: center; gap: 8px; }
.doc-name small { font: 400 12.5px var(--f-body); color: var(--muted); }
.dirty { width: 8px; height: 8px; border-radius: 50%; background: var(--wait); display: inline-block; }
.menu { position: relative; }
.menu > button { background: none; border: 0; padding: 5px 10px; border-radius: 6px; }
.menu > button:hover, .menu.open > button { background: var(--accent-soft); }
.menu-list { position: absolute; top: calc(100% + 4px); left: 0; min-width: 250px; background: var(--page); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; display: none; }
.menu.open .menu-list { display: block; }
.menu-list button { display: flex; justify-content: space-between; gap: 16px; width: 100%; text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 5px; }
.menu-list button:hover { background: var(--accent-soft); }
.menu-list kbd { font: 12.5px var(--f-mono); color: var(--muted); }
.menu-list hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.spacer { flex: 1; }
.applied { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); background: var(--page); white-space: nowrap; }
.chip.now { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip.wait { background: var(--wait-soft); border-color: var(--wait); color: var(--wait); }
.chip.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }

/* toolbar row */
.toolbar { display: flex; gap: 12px; align-items: center; padding: 10px 16px 0; flex-wrap: wrap; }
.toolbar .chatpick { margin-left: auto; }
.toolbar2 { padding-top: 8px; }
.toolbar2:has(.tools[hidden]) .search { display: none; }
.tabs { display: flex; gap: 2px; background: var(--menu); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.tabs button { border: 0; background: none; padding: 5px 14px; border-radius: 6px; }
.tabs button[aria-selected="true"] { background: var(--page); box-shadow: var(--shadow); font-weight: 700; }
.chatpick { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.chatpick select { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--page); }
.example { font-size: 12.5px; color: var(--wait); border: 1px dashed var(--wait); border-radius: 6px; padding: 2px 8px; }

/* workspace */
.work { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 16px; padding: 12px 16px 24px; flex: 1; }
/* the World tab's choices stand out (Miinthe, 2026-10-19: "barely noticeable … needs a bigger contrast like the other choices in pitches") */
.side .seg2.strong button { border: 1px solid transparent; }
.side .seg2.strong button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 700; box-shadow: none; }
.wpe { border-top: 1px dashed var(--line); margin-top: 4px; }
.side textarea.wq { width: 100%; margin-top: 4px; resize: vertical; }
.side input.wi { width: 100%; margin-top: 4px; }
.side .wplist { display: flex; flex-direction: column; padding: 4px 0 8px; }
.side .wphead, .side .wprow { display: grid; grid-template-columns: minmax(0, 1fr) auto 28px 28px; gap: 6px; align-items: center; }
.side .wphead { font-size: 11px; color: var(--muted); padding: 2px 0 4px; border-bottom: 1px solid var(--line); }
.side .wprow { padding: 3px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); }
.side .wprow[hidden] { display: none; }
.side .wpn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; } .side .wpn small { color: var(--muted); }
.side .wpd { display: inline-flex; gap: 4px; }
.side .wdot { display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink); font-size: 11px; cursor: pointer; }
.side .wdot b { color: var(--muted); font-weight: 700; } .side .wdot i { font-style: normal; letter-spacing: -1px; color: var(--accent); } .side .wdot i span { opacity: .25; color: var(--ink); }
.side .wdot:hover { border-color: var(--accent); }
.side .wmb { width: 28px; height: 26px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; filter: grayscale(1); opacity: .55; }
.side .wmb:hover { border-color: var(--line); opacity: 1; } .side .wmb.on { filter: none; opacity: 1; border-color: var(--bad, #c55); }
.side .wmb[data-wp-open] { filter: none; opacity: .8; }
.side .wpx { padding: 4px 0 8px; border-bottom: 1px solid var(--line); }
.side .wnever { display: flex; flex-direction: column; gap: 4px; padding-top: 6px; }
.side .wnever > span { display: flex; flex-wrap: wrap; gap: 4px; }
.side .wchip { font: inherit; font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
.side .wchip.on { border-color: var(--bad, #c55); color: var(--bad, #c55); }
.side input.wps { width: 100%; margin: 4px 0; }
.side .wdials { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; }
.side .wdial { display: inline-flex; align-items: center; gap: 4px; } .side .wdial small { color: var(--muted); font-size: 11px; }
.side .wdial .seg2 button { padding: 2px 6px; font-size: 11.5px; }
.side .wmix { display: flex; flex-direction: column; gap: 6px; padding: 8px 0; border-top: 1px dashed var(--line); }
.side .wmixr { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; } .side .wmixr small { color: var(--muted); }
.side .wsu-note { padding: 8px 10px; border-radius: 8px; background: color-mix(in oklab, #ff79b0 12%, transparent); border-left: 3px solid #ff79b0; font-size: 12.5px; line-height: 1.45; }
.side .wqh { display: flex; align-items: center; gap: 8px; width: 100%; }
.wprow.out { opacity: .6; } .wprow.out .wpn small { color: var(--muted); }
.side .wqh .wmute { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.wpe .wpe-when { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
.wpe textarea.s { width: 100%; margin-top: 6px; resize: vertical; }
.side .linkish { border: 0; background: none; padding: 0; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; text-align: left; }
.side .linkish:hover { text-decoration: underline; }
/* the World tab's main space: the side panel's cards, without its layout */
.wov.wide { max-width: none; }
.wov .side.wpanel { position: static !important; top: auto !important; max-height: none !important; overflow: visible; padding: 0; border: 0; box-shadow: none; background: transparent; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 0 14px; align-items: start; }
.wov .wband { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; border: 1px solid color-mix(in oklab, var(--good) 40%, var(--line)); background: linear-gradient(120deg, color-mix(in oklab, var(--good) 14%, var(--page)), var(--page) 70%); }
.wov .wglobe { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; font-size: 24px; background: color-mix(in oklab, var(--good) 22%, var(--page)); }
.wov .wbt { flex: 1; min-width: 160px; } .wov .wbt h2 { margin: 0; } .wov .wbt small { color: var(--muted); }
.wov .wbadges { display: flex; flex-wrap: wrap; gap: 6px; }
.wov .wbadge { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--page); font-size: 12px; }
.wov .wbadge.q { color: var(--muted); } .wov .wbadge.live { color: var(--good); border-color: color-mix(in oklab, var(--good) 50%, var(--line)); } .wov .wbadge.pause { color: var(--wait); border-color: var(--wait); }
.wov.letters .wband { background: linear-gradient(120deg, color-mix(in oklab, #c8b48a 22%, var(--page)), var(--page) 70%); border-color: color-mix(in oklab, #c8b48a 50%, var(--line)); }
.wov.letters .wbt h2 { font-family: Georgia, "Times New Roman", serif; letter-spacing: .02em; }
.wov .wch { display: flex; align-items: center; gap: 8px; } .wov .wci { font-size: 16px; }
.wov-card { border-top: 3px solid color-mix(in oklab, var(--good) 55%, var(--line)) !important; }
.wov .wnums { display: flex; flex-wrap: wrap; gap: 4px 14px; } .wov .wnums b { font: 700 20px/1.1 var(--f-display); } .wov .wnums .hot b { color: var(--good); }
.wov .wst { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; } .wov .wst small { grid-column: 1 / -1; color: var(--muted); }
.wov .wpdots { display: inline-flex; gap: 3px; } .wov .wpdots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); } .wov .wpdots i.on { background: var(--good); }
.wov .wli { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; } .wov .wli > span:last-child { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.wov .wbz { display: grid; grid-template-columns: 22px minmax(0, 1fr) 60px auto; gap: 8px; align-items: center; font-size: 12.5px; }
.wov .wbz i { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--good) var(--w), color-mix(in srgb, var(--line) 60%, transparent) var(--w)); } .wov .wbz small { color: var(--muted); }
.wpic { flex: none; width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; overflow: hidden; font: 700 11px var(--f-body); color: #fff; background: hsl(var(--h, 200) 45% 42%); vertical-align: middle; margin-right: 6px; }
.wpic img { width: 100%; height: 100%; object-fit: cover; } .wpic.sm { width: 20px; height: 20px; font-size: 10px; margin-right: 0; }
.wov-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.wov-card { display: flex; flex-direction: column; gap: 5px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; }
.wov-card .wch b { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.wov-card small { color: var(--muted); }
.wov { max-width: 640px; display: flex; flex-direction: column; gap: 10px; }
.wov h2 { margin: 0; font: 700 20px/1.2 var(--f-display, inherit); }
.wov .mini { margin: 0; }
.wov-sec { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; }
.wov-row { display: flex; flex-direction: column; } .wov-row small { color: var(--muted); }
.wov-empty { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; padding: 16px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); }
.wov-empty b { color: var(--ink); }
.page { background: var(--page); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; padding: 20px; }
.page h1 { font: 700 26px/1.15 var(--f-display); margin: 0 0 2px; text-wrap: balance; }
.page .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }

.board-scroll { overflow-x: auto; position: relative; padding-bottom: 8px; }
.board { position: relative; display: flex; flex-direction: column; min-width: max-content; }
.arrows { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.arrows .link { fill: none; stroke-width: 1.8; stroke-dasharray: 6 4; opacity: .3; }
.arrows .link.on { opacity: 1; stroke-width: 2.4; stroke-dasharray: none; }
.arrows .link.block { stroke-dasharray: 2 4; stroke-linecap: round; }
.arrows .link.excl { stroke-dasharray: 10 3 2 3; }
.arrows .link.block.on { stroke-dasharray: 2 5; }
.arrows .hit { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; cursor: help; }
.arrows marker path { stroke: none; }
.ltip { position: fixed; z-index: 70; pointer-events: none; background: var(--ink); color: var(--page); font-size: 13px; padding: 5px 9px; border-radius: 6px; max-width: 280px; box-shadow: var(--shadow); }
.ltip i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.swatches { display: flex; gap: 4px; }
.swatches button { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
.swatches button.on { border-color: var(--ink); }
.cond { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); border-left: 4px solid var(--lc); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
.cond .top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.cond .top button { border: 0; background: none; color: var(--muted); }
.dotc { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }

.row { position: relative; z-index: 1; display: grid; grid-template-columns: 200px auto; gap: 14px; align-items: start; }
.row.waiting .stepcol > *, .row.waiting .join { opacity: .55; }
.row.waiting .step.linked { opacity: 1; }   /* a lit card shows at full strength even in a waiting row */
.thead { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--menu); text-align: left; width: 100%; }
.thead:hover, .thead.sel { border-color: var(--accent); }
.thead b { font: 700 15px var(--f-display); display: block; margin-bottom: 4px; }
.thead .chips { display: flex; gap: 4px; flex-wrap: wrap; }

.steps { display: flex; align-items: flex-start; gap: 0; }
.stepcol { display: flex; flex-direction: column; align-items: stretch; gap: 8px; width: 150px; }
.join { width: 26px; height: 2px; background: var(--line); margin-top: 22px; flex: none; }
.step { border: 1.5px solid var(--line); background: var(--page); border-radius: 8px; padding: 8px 10px; text-align: left; min-height: 46px; position: relative; }
.step:hover, .step.sel { border-color: var(--accent); }
.step.now { border-color: var(--now); background: var(--accent-soft); }
.step .n { font: 11.5px var(--f-mono); color: var(--muted); display: block; }
.step .t { font-weight: 700; }
.step .here, .branch .here, .item .here { position: absolute; top: -9px; right: 8px; font: 600 10px var(--f-body); background: var(--now); color: var(--page); padding: 1px 6px; border-radius: 99px; letter-spacing: .04em; text-transform: uppercase; }
.entry { font-size: 12.5px; border: 1px solid var(--line); border-left: 3px solid var(--good); border-radius: 6px; padding: 4px 8px; background: var(--page); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry.missing { border-left-color: var(--bad); color: var(--bad); border-style: dashed; }
.detour { font-size: 12.5px; border: 1px dashed var(--muted); border-radius: 6px; padding: 4px 8px; color: var(--muted); }
.detour::before { content: "↳\00a0"; }
.detour.dsum::before { content: none; }

/* side panel */
.side { background: var(--page); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 16px; align-self: start; position: sticky; top: 60px; max-height: calc(100vh - 80px); overflow: auto; min-width: 0; }
.side h2 { font: 700 18px var(--f-display); margin: 0 0 2px; }
.side h2.rn { cursor: text; border-radius: 6px; }
.side h2.rn:hover, .side h2.rn:focus-visible { background: var(--menu); outline: 1px dashed var(--line); outline-offset: 2px; }
.side h2 .rnin { font: inherit; color: inherit; width: 100%; box-sizing: border-box; padding: 0 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--page); }
.side .kind { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.side section { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.side h3 { font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.field input, .field select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--page); }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.check input { margin-top: 3px; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--menu); border-radius: 6px; padding: 5px 10px; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--page); }
.steplist { display: flex; flex-direction: column; gap: 4px; }
.steplist div { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.steplist input { flex: 1; min-width: 0; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--page); }
.steplist button { border: 1px solid var(--line); background: var(--menu); border-radius: 5px; width: 26px; height: 26px; padding: 0; }
.note { font-size: 12.5px; color: var(--muted); }

/* timeline */
.tl-chart { width: 100%; overflow: hidden; }
.tl-chart svg { display: block; }
.tl-chart .grid { stroke: var(--line); stroke-width: 1; }
.tl-chart .lbl { fill: var(--muted); font: 11.5px var(--f-body); }
.tl-chart .num { fill: var(--muted); font: 10px var(--f-mono); }
.tl-chart .ln { fill: none; stroke: var(--accent); stroke-width: 2; }
.tl-chart .dot { fill: var(--accent); }
.tl-chart .dot.hand { fill: var(--page); stroke: var(--accent); stroke-width: 2; }
.tl-chart .dot.ref { fill: var(--bad); }
.tl-chart .dot.sel { r: 7; }
.tl-chart circle { cursor: pointer; }

.side .draft { border: 1px solid var(--line); border-left: 3px solid var(--k-context); border-radius: 8px; padding: 8px 10px; background: var(--page); }
.side .draft b { display: block; font-size: 13px; } .side .draft small { display: block; color: var(--muted); font-size: 11.5px; margin: 2px 0 6px; } .side .draft p { margin: 0; font-size: 12.5px; line-height: 1.45; }

/* abandoned rows fold small and gray */

/* toolbar: one icon set — thin line icons in the text color */
.tool .ic { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; margin-right: 5px; flex: none; }

.side .npnew textarea { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--page); font: inherit; }

/* connection panel + overview */
.side h2.lnh { font-size: 16px; line-height: 1.35; }

/* the icon picker (Miinthe, 2026-10-05): opens on any icon field; emoji only — design rule: emoji = a meaning */
.epick { position: fixed; z-index: 100000; width: 316px; max-width: calc(100vw - 24px); max-height: min(380px, 70vh); display: flex; flex-direction: column; background: var(--page); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }

/* steps: the tracker's color as a strip; tile-kind colors from Appearance */

.side .pill:hover .x { display: block; }

.kind-legend span { cursor: help; }

// ── smart arrange: everything a row depends on sits right above it ──
function smartArrange() {
  const links = (() => { const keep = fv; fv = null; const a = connections(); fv = keep; return a; })();
  const sources = id => [...new Set(links.filter(l => l.to === id && l.from !== id).map(l => l.from))];
  // costs: a collection whose items cost from a counter depends on that counter
  const costSrc = t => isCol(t) ? [...new Set(t.items.filter(it => it.cost && it.cost.counter).map(it => it.cost.counter))] : [];
  const out = [], seen = new Set(), busy = new Set();
  const visit = id => {
    if (seen.has(id) || busy.has(id) || !T(id)) return;
    busy.add(id);
    for (const s2 of [...sources(id), ...costSrc(T(id))]) visit(s2);
    busy.delete(id); seen.add(id); out.push(T(id));
  };
  doc.trackers.forEach(t => visit(t.id));
  const before = doc.trackers.map(t => t.name).join(' · '), after = out.map(t => t.name).join(' · ');
  if (before === after) { toast('Already arranged — everything sits below what it depends on.'); return; }
  doc.trackers = out; scrollToNow = true; touch();
  toast('Arranged: each row sits right below what it depends on. Undo puts it back.');
}
