<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mero</title>
<!-- LOCAL PATCH (Miinthe, 2026-10-05): Mero ☆, the co-writer tab. Everything real comes from window.parent.__dleMeroHost
     (src/mero-window.js). Overhaul (2026-10-15): restyled to the side panel + bar mock-up v13 — her talk on the left,
     a rail of line icons on the outer edge (left when the side panel is on the left), drawers open from the rail.
     Colors are SillyTavern's live theme through the shared bridge (src/kit/theme.js → --dk-*); no colors of its own. -->
<style>
/* Layout: Mero's tab fills the iframe — the talk (head, messages, composer) and the rail; drawers slide over the talk (beside it when popped out). */
* { box-sizing: border-box; }
* { scrollbar-width: thin; scrollbar-color: color-mix(in oklab, var(--dk-muted) 45%, transparent) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: color-mix(in oklab, var(--dk-muted) 40%, transparent); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
html, body { height: 100%; }
/* see-through like the other tabs, so the SillyTavern theme shows (Miinthe 2026-10-18, Azure + Moonlit Echoes: Mero was a solid dark box);
   cards, the input, the pull-out drawers keep their own surfaces; popped out, the window behind her has one */
body { margin: 0; padding: 0; overflow: hidden; background: transparent; color: var(--dk-ink); font: var(--dk-fs)/1.45 var(--dk-f-body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--dk-accent-ink); outline-offset: 2px; }
[hidden] { display: none !important; }
.dk-i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mini { font-size: var(--dk-fs-s); color: var(--dk-muted); }

/* ── the tab ── */
.panel { height: 100%; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.mero { flex: 1; min-height: 0; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 44px; position: relative; }
.mero > .talk { grid-column: 1; grid-row: 1; }
.mero > .rail { grid-column: 2; grid-row: 1; }
.talk { min-height: 0; min-width: 0; display: flex; flex-direction: column; }

/* her talk: title, kind of talk, ⓘ, ⋯; one line under it */
.thead { padding: 8px 10px; border-bottom: 1px solid var(--dk-line); display: grid; grid-template-columns: minmax(0, 1fr); gap: 3px; }
.thead .t1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.thead h2 { flex: 1; min-width: 0; margin: 0; font: 700 var(--dk-fs-l)/1.2 var(--dk-f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thead .t2 { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kindsel { flex: none; max-width: 104px; height: 20px; padding: 0 8px; display: inline-flex; align-items: center; white-space: nowrap; cursor: default; border: 0; border-radius: 999px; font: 700 calc(11px * var(--fontScale, 1))/1 var(--dk-f-body); background: var(--dk-accent-soft); color: var(--dk-accent-ink); }
.kindsel.yap { background: var(--dk-mero-soft); color: var(--dk-mero); }
.kindsel.plan { background: var(--dk-good-soft); color: var(--dk-good); }
.kindsel.fb { background: var(--dk-bad-soft); color: var(--dk-bad); }
.kindsel.game { background: var(--dk-wait-soft); color: var(--dk-wait); }
.ib { width: 28px; height: 28px; flex: none; display: grid; place-items: center; padding: 0; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--dk-muted); }
.ib:hover, .ib[aria-expanded="true"] { color: var(--dk-ink); background: var(--dk-menu); border-color: var(--dk-line); }
.ttl { cursor: text; border-radius: 6px; padding: 0 3px; }
.ttl:hover { background: var(--dk-menu); }
.ttl input { font: inherit; border: 1px solid var(--dk-accent); border-radius: 6px; padding: 0 4px; width: 100%; background: var(--dk-page); }
.smart { font-size: var(--dk-fs-s); color: var(--dk-mero); font-weight: 700; }

/* messages */
.msgs { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.msgs > *, .db > *, .stack > * { flex-shrink: 0; }
.m { max-width: 92%; padding: 7px 10px; border-radius: 10px; font-size: var(--dk-fs); overflow-wrap: anywhere; }
.m.author { align-self: flex-end; background: var(--dk-accent-soft); }
.m.mer { align-self: flex-start; background: var(--dk-menu); border: 1px solid var(--dk-line); }
/* each message's own header (2026-11-02): Mero's name, her lookups (click to see them), the swipes, the buttons */
.m.mer { min-width: min(250px, 92%); }   /* room for the header on one line */
.mh > * { flex: none; white-space: nowrap; }
.mh { display: flex; flex-wrap: nowrap; align-items: center; gap: 6px; min-height: 20px; margin: -2px 0 2px; font: 700 calc(11px * var(--fontScale, 1))/1.3 var(--dk-f-display); color: var(--dk-mero); }
.mh .sp { flex: 1 1 0; min-width: 0; }
.m.author .mh { margin: 0 0 2px; min-height: 0; color: inherit; }
.m.author .mh .me { opacity: .85; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
.mh .look { border: 0; background: none; padding: 0 2px; color: var(--dk-muted); font: 600 var(--dk-fs-xs)/1.3 var(--dk-f-body); text-decoration: underline dotted; }
.mh .nolook { color: var(--dk-muted); font: 600 var(--dk-fs-xs)/1.3 var(--dk-f-body); opacity: .8; cursor: help; }
.mh .look:hover, .mh .look[aria-expanded="true"] { color: var(--dk-ink); }
.mh .swp { display: inline-flex; align-items: center; gap: 2px; color: var(--dk-muted); font: 600 var(--dk-fs-xs)/1 var(--dk-f-body); }
.mh .swp button, .mact button { width: 22px; height: 20px; display: inline-grid; place-items: center; padding: 0; border: 0; border-radius: 5px; background: transparent; color: var(--dk-muted); }
.mh .swp button:hover:not(:disabled), .mact button:hover { background: var(--dk-page); color: var(--dk-ink); }
.mh .swp button:disabled { opacity: .3; cursor: default; }
.mact { display: inline-flex; gap: 1px; opacity: 0; transition: opacity .12s; }
.m:hover .mact, .m:focus-within .mact, .mact.sure { opacity: 1; }
@media (hover: none) { .mact { opacity: .7; } }
.mact .dk-i { width: 13px; height: 13px; }
.mact button[data-mkeep] { width: auto; padding: 0 6px; font: 700 var(--dk-fs-xs)/1 var(--dk-f-body); color: var(--dk-ink); }
.mact button.sure { width: auto; padding: 0 6px; background: var(--dk-bad-soft); color: var(--dk-bad); font: 700 var(--dk-fs-xs)/1 var(--dk-f-body); }
.steps { margin: 0 0 6px; padding: 5px 8px; border-left: 2px solid var(--dk-mero); border-radius: 0 6px 6px 0; background: color-mix(in oklab, var(--dk-mero) 7%, transparent); display: grid; gap: 2px; font-size: var(--dk-fs-s); }
.steps .got { color: var(--dk-muted); }
.m .edit { display: grid; gap: 6px; min-width: min(320px, 70vw); }
.m .edit textarea { width: 100%; resize: vertical; min-height: 60px; border: 1px solid var(--dk-accent); border-radius: 8px; padding: 5px 8px; background: var(--dk-page); color: var(--dk-ink); font: inherit; }
/* Mero is typing… with each lookup on its own line, as it happens */
.busy .wk { display: block; padding-left: 14px; color: var(--dk-muted); }
.busy .wk.on::after { content: " …"; }
/* 💡 pitches made from the talk, right in it, with their buttons */
.tpc { align-self: stretch; display: flex; flex-direction: column; gap: 6px; padding: 9px 11px 10px; border: 1px solid var(--dk-line); border-top: 3px solid var(--dk-mero); border-radius: 10px; background: var(--dk-page); font-size: var(--dk-fs); }
.tpc .ch { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: var(--dk-fs-s); color: var(--dk-muted); }
.tpc .ch .no { font-family: var(--dk-f-mono); }
.tpc .ch .sp { flex: 1; }
.tpc ol { margin: 0; padding-left: 20px; display: grid; gap: 3px; }
.tpc .row .btn { height: 24px; padding: 0 8px; font-size: var(--dk-fs-s); }
.tpc textarea, .tpc input { width: 100%; border: 1px solid var(--dk-accent); border-radius: 8px; padding: 5px 8px; background: var(--dk-page); color: var(--dk-ink); font: inherit; }
.tpc textarea { resize: vertical; min-height: 60px; }
/* ❓ question cards (Miinthe, 2026-11-02: "multi selection to wrap up the plan, like Claude does") */
.askc { align-self: stretch; display: grid; gap: 10px; padding: 9px 11px 10px; border: 1px solid var(--dk-line); border-left: 3px solid var(--dk-mero); border-radius: 10px; background: var(--dk-page); }
.askc .aq { display: grid; gap: 5px; }
.askc .aq b { font-weight: 700; }
.askc .aq .mini { margin-left: 6px; font-weight: 400; }
.askc .aopts { display: grid; gap: 4px; }
.askc .aopt { display: flex; gap: 8px; align-items: flex-start; width: 100%; padding: 6px 9px; border: 1px solid var(--dk-line); border-radius: 8px; background: transparent; color: var(--dk-ink); text-align: left; font: inherit; }
.askc .aopt:hover { border-color: color-mix(in oklab, var(--dk-mero) 50%, var(--dk-line)); }
.askc .aopt[aria-pressed="true"] { border-color: var(--dk-mero); background: var(--dk-mero-soft); font-weight: 600; }
.askc .aopt .mk { flex: none; width: 14px; text-align: center; color: var(--dk-mero); }
.askc .aown { width: 100%; height: 30px; padding: 0 9px; border: 1px dashed var(--dk-line); border-radius: 8px; background: transparent; color: var(--dk-ink); font: inherit; }
.askc .adet { width: 100%; min-height: 44px; resize: none; padding: 6px 9px; border: 1px solid var(--dk-line); border-radius: 8px; background: transparent; color: var(--dk-ink); font: inherit; }
.askc .adet:focus { outline: none; border-color: var(--dk-mero); }
.askc .aown:focus { outline: none; border-style: solid; border-color: var(--dk-mero); }
.askc.done { gap: 4px; opacity: .9; }
.askc.done .got { color: var(--dk-muted); font-size: var(--dk-fs-s); }
.askc.done .got b { color: var(--dk-ink); font-weight: 600; }
.pc .popen, .tpc .popen { font-size: var(--dk-fs-s); color: var(--dk-muted); font-style: italic; }
.sess .badges { flex: none; min-width: 18px; height: 18px; padding: 0 5px; display: inline-grid; place-items: center; border: 1px solid var(--dk-line); border-radius: 999px; background: var(--dk-menu); color: var(--dk-muted); font: 700 var(--dk-fs-xs)/1 var(--dk-f-body); }   /* 9 one count look */
.m.sys { align-self: center; padding: 0; background: none; font-size: var(--dk-fs-s); color: var(--dk-muted); }
.m .pnos { display: block; margin-top: 4px; font-size: var(--dk-fs-s); font-weight: 700; color: var(--dk-mero); }
.m .pnos button { border: 0; background: none; color: inherit; text-decoration: underline dotted; padding: 0; font: inherit; }
.tlink { border: 0; background: none; padding: 0; color: var(--dk-accent-ink); text-decoration: underline dotted; font: inherit; }

/* cards (a note to keep, a request, a moment): a colored top edge */
.card { display: flex; flex-direction: column; gap: 6px; padding: 9px 11px 10px; border: 1px solid var(--dk-line); border-top: 3px solid var(--kc, var(--dk-line)); border-radius: 10px; background: var(--dk-page); font-size: var(--dk-fs); }
.card .ch { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font: 700 var(--dk-fs)/1.3 var(--dk-f-body); }
.card .ch small { font-weight: 400; color: var(--dk-muted); }
.card .row, .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.card select, .note select { height: 24px; border: 1px solid var(--dk-line); background: var(--dk-page); border-radius: 999px; padding: 0 6px; font-size: var(--dk-fs-s); max-width: 100%; }
.card.helper { background: color-mix(in oklab, var(--dk-accent-soft) 60%, var(--dk-page)); }
.card.done { opacity: .8; }
.cardstate { font-size: var(--dk-fs-s); font-weight: 700; color: var(--dk-good); }
.cardstate.no { color: var(--dk-muted); }
.q { font-style: italic; color: var(--dk-muted); font-size: var(--dk-fs-s); border-left: 2px solid var(--dk-line); padding-left: 8px; }

/* buttons: line icon + word (v13) */
.btn { height: 28px; padding: 0 10px; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--dk-line); border-radius: 8px; background: var(--dk-page); color: var(--dk-ink); font-size: var(--dk-fs); white-space: nowrap; }
.btn:hover { background: var(--dk-menu); }
.btn .dk-i { width: 14px; height: 14px; }
.btn.p { background: var(--dk-accent); border-color: var(--dk-accent); color: var(--dk-on-accent); font-weight: 700; }
.btn.m2 { background: var(--dk-mero); border-color: var(--dk-mero); color: var(--dk-on-mero); font-weight: 700; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--dk-ink); }
.btn.ghost:hover { background: var(--dk-menu); }
.btn:disabled { opacity: .4; cursor: default; }

/* composer */
.busy { font-size: var(--dk-fs-s); color: var(--dk-mero); padding: 0 12px 6px; }
.err { font-size: var(--dk-fs-s); color: var(--dk-bad); padding: 4px 12px; }
.comp { border-top: 1px solid var(--dk-line); padding: 8px; display: grid; gap: 6px; }
.grow { width: 100%; resize: none; overflow: hidden; min-height: 30px; border: 1px solid var(--dk-line); border-radius: 8px; padding: 5px 8px; background: var(--dk-page); color: var(--dk-ink); font: inherit; }
.comp textarea { min-height: 38px; border-radius: 10px; padding: 8px 10px; }
.grow:focus, .field:focus { outline: none; border-color: var(--dk-accent); box-shadow: 0 0 0 2px var(--dk-accent-soft); }
.grow::placeholder, .field::placeholder { color: var(--dk-muted); }
.comp .row .sp { flex: 1; }
/* one row, whatever the panel's width (Miinthe, 2026-10-19: with 📎 "this menu now takes awkwardly two rows"): narrow, Pitch keeps its icon only */
.comp { container-type: inline-size; }
.comp .row { flex-wrap: nowrap; gap: 4px; min-width: 0; }
.comp .row .btn { flex: none; white-space: nowrap; }
#c-ctx { padding-inline: 7px; }
@container (max-width: 330px) { #c-pitch span { display: none; } #c-pitch { padding-inline: 7px; } }
@container (max-width: 250px) { #c-where { font-size: var(--dk-fs-s); padding-inline: 6px; } }
.notesline { font-size: var(--dk-fs-s); color: var(--dk-muted); }

/* the rail: Talks, Requests, Notes, Pitches … pop-out, her settings */
.rail { border-left: 1px solid var(--dk-line); background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 0; }
.rail .sp { flex: 1; }
.ri { position: relative; width: 34px; height: 34px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--dk-muted); }
.ri .dk-i { width: 18px; height: 18px; }
.ri:hover { color: var(--dk-ink); background: var(--dk-page); }
.ri[aria-pressed="true"] { color: var(--dk-mero); background: var(--dk-mero-soft); }
.ri .rdot { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--dk-mero); }
.ri.hold .rdot { background: var(--dk-wait); }
.ri.glow { box-shadow: 0 0 0 2px var(--dk-mero), 0 0 12px color-mix(in oklab, var(--dk-mero) 60%, transparent); color: var(--dk-mero); }
@media (prefers-reduced-motion: no-preference) {
  .ri.hold { animation: wiggle 4s ease-in-out infinite; }
  @keyframes wiggle { 0%, 88%, 100% { transform: rotate(0); } 90% { transform: rotate(-9deg); } 93% { transform: rotate(8deg); } 96% { transform: rotate(-4deg); } }
}

.sessrow { display: flex; align-items: stretch; gap: 2px; } .sessrow > .sess { flex: 1; min-width: 0; } .sessrow .sessdel { flex: none; align-self: center; opacity: .5; } .sessrow:hover .sessdel, .sessrow .sessdel:focus-visible { opacity: 1; }
.sessask { display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 1px solid var(--dk-bad); border-radius: 8px; width: 100%; } .sessask .row { display: flex; flex-wrap: wrap; gap: 6px; }
/* Focus: pick one or more → pills, as every "several at once" row (unification, 2026-11-03) */
#p-focus { flex-wrap: wrap; gap: 5px; padding: 0; border: 0; background: none; }
#p-focus > button { flex: none; height: 24px; padding: 0 9px; border: 1px solid var(--dk-line); border-radius: 999px; background: var(--dk-page); color: var(--dk-ink); font: var(--dk-fs-s)/1 var(--dk-f-body); }
#p-focus > button:hover { border-color: var(--dk-line-strong); }
#p-focus > button[aria-pressed="true"] { background: var(--dk-selected); border-color: var(--dk-accent); font-weight: 400; }
#p-focus .fadd { border-style: dashed; color: var(--dk-muted); }
#p-focus .fpick { flex: 1 1 100%; display: flex; flex-direction: column; gap: 4px; padding: 6px; border: 1px solid var(--dk-line); border-radius: 8px; background: var(--dk-page); }
#p-focus .fpick input { height: 28px; padding: 0 8px; border: 1px solid var(--dk-line); border-radius: 6px; background: var(--dk-panel, transparent); color: var(--dk-ink); font: inherit; }
#p-focus .flist { max-height: 168px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
#p-focus .flist button { all: unset; box-sizing: border-box; padding: 5px 8px; border-radius: 6px; color: var(--dk-ink); cursor: pointer; } #p-focus .flist button:hover, #p-focus .flist button:focus-visible { background: var(--dk-accent-soft); }
#p-focus .fgh { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--dk-muted); padding: 4px 8px 0; }
/* 📎 add context: the picker above the box, the picked ones as chips, and on Miinthe's message */
.comp { min-width: 0; position: relative; }
/* @ mentions: a short list above the box — plain divs with their own colors (the old 📎 list showed "lines and dots" in a narrow panel) */
.atmenu { position: absolute; left: 0; right: 0; bottom: calc(100% + 4px); z-index: 20; max-height: 240px; overflow-y: auto; padding: 4px; border: 1px solid var(--dk-line); border-radius: 8px; background: var(--dk-menu, var(--dk-page)); box-shadow: 0 6px 20px rgba(0, 0, 0, .35); }
.atmenu .atg { padding: 6px 8px 2px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--dk-muted); }
.atmenu .ati { display: flex; flex-direction: column; gap: 1px; width: 100%; box-sizing: border-box; padding: 5px 8px; border-radius: 6px; color: var(--dk-ink); cursor: pointer; overflow-wrap: anywhere; }
.atmenu .ati b { font-weight: 600; font-size: 12.5px; color: var(--dk-mero); }
.atmenu .ati span { font-size: 12px; color: var(--dk-muted); }
.atmenu .ati.on, .atmenu .ati:hover { background: var(--dk-accent-soft); }
.atmenu .atnone { padding: 8px; font-size: 12px; color: var(--dk-muted); }
.ctxchips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; min-width: 0; max-width: 100%; }
.ctxchip .cl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctxchip { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; min-width: 0; box-sizing: border-box; padding: 2px 4px 2px 8px; border-radius: 999px; background: var(--dk-accent-soft); color: var(--dk-ink); font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ctxchip button { border: 0; background: transparent; color: var(--dk-muted); cursor: pointer; padding: 0 3px; }
.m .ctxs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; } .m .ctxs span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; opacity: .8; padding: 1px 6px; border-radius: 999px; background: color-mix(in oklab, var(--dk-ink) 10%, transparent); }
/* drawers slide over the talk, from the rail's side */
.drawer { position: absolute; inset: 0 44px 0 0; z-index: 3; display: flex; flex-direction: column; min-height: 0; background: var(--dk-page); border-right: 1px solid var(--dk-line); box-shadow: 0 0 24px rgba(0, 0, 0, .35); }
.dh { display: flex; align-items: center; gap: 6px; padding: 8px 6px 8px 12px; border-bottom: 1px solid var(--dk-line); min-width: 0; }
.dh h3 { flex: 1; min-width: 0; margin: 0; font: 700 var(--dk-fs-l)/1.2 var(--dk-f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.db { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.db h4 { margin: 4px 0 0; font: 700 var(--dk-fs-xs)/1.2 var(--dk-f-body); letter-spacing: .07em; text-transform: uppercase; color: var(--dk-muted); }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .16s ease-out; } @keyframes slide { from { transform: translateX(14px); opacity: .6; } } }

/* the side panel on the left: the rail on the outer (left) edge, drawers open from there (v13) */
body.pleft .mero { grid-template-columns: 44px minmax(0, 1fr); }
body.pleft .mero > .talk { grid-column: 2; }
body.pleft .mero > .rail { grid-column: 1; border-left: 0; border-right: 1px solid var(--dk-line); }
body.pleft .drawer { inset: 0 0 0 44px; border-right: 0; border-left: 1px solid var(--dk-line); }
@media (prefers-reduced-motion: no-preference) { body.pleft .drawer { animation-name: slideL; } @keyframes slideL { from { transform: translateX(-14px); opacity: .6; } } }

/* popped out into her own window: the drawer sits beside the talk */
body.wide .mero { grid-template-columns: 330px minmax(0, 1fr) 44px; }
body.wide .mero > .talk { grid-column: 2; }
body.wide .mero > .rail { grid-column: 3; }
body.wide .drawer { position: static; grid-column: 1; grid-row: 1; box-shadow: none; }
/* no drawer open: no empty column beside the talk (Miinthe 2026-10-18: "the left half of the window is empty") */
body.wide .mero:not(:has(> .drawer:not([hidden]))) { grid-template-columns: minmax(0, 1fr) 44px; }
body.wide .mero:not(:has(> .drawer:not([hidden]))) > .talk { grid-column: 1; }
body.wide .mero:not(:has(> .drawer:not([hidden]))) > .rail { grid-column: 2; }
@media (max-width: 700px) {
  body.wide .mero { grid-template-columns: minmax(0, 1fr) 44px; }
  body.wide .mero > .talk { grid-column: 1; }
  body.wide .mero > .rail { grid-column: 2; }
  body.wide .drawer { position: absolute; }
}

/* folds inside the drawers */
.foldh { width: 100%; min-height: 36px; display: flex; gap: 8px; align-items: center; padding: 0 8px 0 10px; border: 1px solid var(--dk-line); border-radius: 10px; background: transparent; text-align: left; color: var(--dk-ink); cursor: pointer; }
/* 8 one fold (coherence 2026-11-03): the label in capitals, the count, the arrow at the end — as the side panel's and Settings' */
.foldh:hover { background: var(--dk-menu); }
.foldh .ft { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 700 var(--dk-fs-xs)/1 var(--dk-f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--dk-muted); }
.foldh .cnt { min-width: 18px; height: 18px; padding: 0 5px; display: inline-grid; place-items: center; border: 1px solid var(--dk-line); border-radius: 999px; background: var(--dk-menu); color: var(--dk-muted); font: 700 var(--dk-fs-xs)/1 var(--dk-f-body); }
.foldh .chev { flex: none; color: var(--dk-muted); transition: transform .15s; }
.foldh[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.more { align-self: flex-start; font-size: var(--dk-fs-s); }

/* talks drawer: a search, the kinds, rows */
.srch { width: 100%; height: 30px; border: 1px solid var(--dk-line); border-radius: 8px; padding: 0 10px; background: var(--dk-menu); color: var(--dk-ink); font-size: var(--dk-fs); }
.seg { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--dk-line); border-radius: 8px; background: var(--dk-menu); flex-wrap: wrap; }
.seg button { flex: 1; height: 26px; padding: 0 9px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--dk-muted); font-size: var(--dk-fs); white-space: nowrap; }   /* = kit .dk-seg */
.seg button:hover { color: var(--dk-ink); }
/* the picked one stands out (Miinthe, 2026-10-19: "contrast of what is selected is still barely visible") — Mero's pink, like the board's strong picks */
.seg button[aria-pressed="true"] { background: var(--dk-accent-soft); border-color: var(--dk-accent); color: var(--dk-ink); font-weight: 700; box-shadow: none; }
.seg button:disabled { opacity: .45; }
.seg.jobs { display: grid; grid-template-columns: 1fr 1fr; }
/* the talk-kind filter stays one row (Miinthe, 2026-10-16: Feedback wrapped onto its own line). Since Games joined, the words
   were cut off ("Yappi…"): "All" in words, the kinds as their icons with the name as tooltip (Miinthe, 2026-11-02) */
#sess-f { flex-wrap: nowrap; }
#sess-f button { min-width: 0; padding: 0 5px; overflow: hidden; text-overflow: ellipsis; }
.sess { width: 100%; min-height: 36px; display: flex; align-items: center; gap: 9px; padding: 4px 8px; border: 0; border-radius: 8px; background: transparent; color: var(--dk-ink); text-align: left; }
.sess:hover { background: var(--dk-accent-soft); }
.sess.on { background: var(--dk-selected); }
.sess .lead { width: 22px; flex: none; display: grid; place-items: center; font-size: calc(15px * var(--fontScale, 1)); }
.sess .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.sess .t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sess .s { font-size: var(--dk-fs-s); color: var(--dk-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* notes drawer */
.nbooks { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; border: 1px solid var(--dk-line); border-radius: 8px; background: var(--dk-menu); }
.nbooks .mini { flex: 1 0 100%; }
.note { border: 1px solid var(--dk-line); border-left: 3px solid var(--kc); border-radius: 8px; padding: 6px 8px; display: grid; gap: 4px; font-size: var(--dk-fs); }
.note.off { opacity: .55; }
.note .n1 { display: flex; gap: 6px; align-items: flex-start; }
.note .n1 > span:first-child { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.note .n2 { font-size: var(--dk-fs-s); color: var(--dk-muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.note .n2 .btn { height: 24px; min-width: 24px; padding: 0 6px; border-radius: 6px; font-size: var(--dk-fs-s); justify-content: center; }   /* 4 the small row buttons: 24 px, corners 6 (coherence) */
/* 🚫 phrases to avoid — the slop guard (Miinthe, 2026-11-02; mock-up https://claude.ai/artifact/ByQff64nfdyDB4acfqYm7N view 2) */
.slop-add { display: flex; gap: 6px; flex-wrap: wrap; }
.slop-add input { flex: 1 1 140px; min-width: 0; }
.slop-add select { flex: none; height: 32px; border: 1px solid var(--dk-line); background: var(--dk-page); color: var(--dk-ink); border-radius: 8px; padding: 0 6px; font-size: var(--dk-fs-s); }
.note.slop { --kc: var(--dk-bad); }
.sl-m { height: 18px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--dk-bad); background: var(--dk-bad-soft); color: var(--dk-bad); font: 700 calc(10.5px * var(--fontScale, 1))/1 var(--dk-f-body); cursor: pointer; vertical-align: 1px; }
.sl-m.less { border-color: var(--dk-wait); background: var(--dk-wait-soft); color: var(--dk-wait); }
.note .hot { color: var(--dk-wait); }
.slop-pre { font-size: var(--dk-fs-s); color: var(--dk-muted); background: var(--dk-desk); border: 1px solid var(--dk-line); border-radius: 8px; padding: 6px 8px; overflow-wrap: anywhere; }
.ntext { cursor: text; }
.ntext textarea { width: 100%; font: inherit; border: 1px solid var(--dk-accent); border-radius: 6px; padding: 2px 4px; background: var(--dk-page); }
.blur { filter: blur(5px); user-select: none; }
.sw { display: inline-flex; gap: 6px; align-items: center; font-size: var(--dk-fs-s); }
.sw input { accent-color: var(--dk-mero); margin: 0; }

/* requests drawer */
.rg { display: flex; gap: 6px; align-items: center; }
.rg-board { color: var(--dk-accent-ink) !important; } .rg-mero { color: var(--dk-mero) !important; } .rg-plan { color: var(--dk-good) !important; }
.pill { height: 18px; padding: 0 6px; display: inline-flex; align-items: center; border-radius: 999px; font: 600 var(--dk-fs-xs)/1 var(--dk-f-body); border: 1px solid var(--dk-line); color: var(--dk-good); background: var(--dk-good-soft); white-space: nowrap; }
.pill.now { background: var(--dk-wait-soft); color: var(--dk-wait); border-color: transparent; }
.ba { border: 1px solid var(--dk-line); border-radius: 7px; padding: 6px 8px; font: var(--dk-fs-s)/1.45 var(--dk-f-mono); background: var(--dk-menu); white-space: pre-wrap; overflow-wrap: anywhere; }
.ba .ctx { color: var(--dk-muted); }
.ba del { background: var(--dk-bad-soft); color: var(--dk-bad); text-decoration: line-through; }
.ba ins { background: var(--dk-good-soft); color: var(--dk-good); text-decoration: none; font-weight: 600; }
.ba textarea { width: 100%; font: inherit; border: 1px solid var(--dk-good); border-radius: 6px; padding: 4px 6px; background: var(--dk-page); color: inherit; }

/* settings drawer: label on the left, the control on the right (v13) */
.pr { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px; align-items: center; font-size: var(--dk-fs); }
.pr > span:first-child { color: var(--dk-muted); }
.pr .mini { grid-column: 2; margin-top: -4px; }
.field { width: 100%; min-height: 30px; border: 1px solid var(--dk-line); border-radius: 8px; padding: 5px 9px; background: var(--dk-page); color: var(--dk-ink); font-size: var(--dk-fs); }
textarea.field { resize: none; }
.vtools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.vtools .sp { flex: 1; }
.swline { display: flex; gap: 8px; align-items: center; min-width: 0; }
.pmore { display: grid; gap: 8px; padding: 8px 10px; border: 1px solid var(--dk-line); border-radius: 8px; }
input[type=range] { accent-color: var(--dk-mero); width: 100%; }

/* pitches: the menu folded into one line; one batch to pick from, one menu at the bottom (v13) */
.pview { display: flex; flex-direction: column; gap: 8px; }
.pview > * { flex-shrink: 0; }
.pmenu { display: grid; gap: 8px; padding: 8px; border: 1px solid var(--dk-line); border-radius: 12px; background: var(--dk-menu); }
.psum { width: 100%; display: flex; align-items: center; gap: 8px; padding: 2px 4px; border: 0; background: transparent; color: var(--dk-ink); text-align: left; font-size: var(--dk-fs); }
.psum span:first-child { flex: 1; min-width: 0; }
.pmenu .pmore { border: 0; padding: 4px 4px 2px; border-top: 1px solid var(--dk-line); border-radius: 0; }
.pmenu .pr { grid-template-columns: 70px minmax(0, 1fr); }
.pmenu select, .pmenu input[type=text] { width: 100%; height: 28px; border: 1px solid var(--dk-line); border-radius: 8px; padding: 0 8px; background: var(--dk-page); color: var(--dk-ink); }
.pmenu .go { display: flex; gap: 8px; align-items: center; }
.pmenu .go .mini { flex: 1; }
/* ✏ her own pitch (2026-11-03) */
.pown .poh { display: flex; gap: 8px; align-items: baseline; }
.pown .poh .mini { flex: 1; }
.pown .po-wait { display: grid; gap: 6px; }
.pown label.inline { display: block; line-height: 1.7; }
.pown label.inline input { vertical-align: middle; margin: 0 4px 0 0; }
.inline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: var(--dk-fs); }
.inline input[type=number] { width: 54px; border: 1px solid var(--dk-line); border-radius: 8px; padding: 2px 6px; background: var(--dk-page); }
.fromchip { display: inline-flex; gap: 6px; align-items: center; font-size: var(--dk-fs-s); font-weight: 700; background: var(--dk-mero-soft); color: var(--dk-mero); border-radius: 999px; padding: 1px 4px 1px 10px; }
.fromchip button { border: 0; background: none; color: inherit; }
.pline { font-size: var(--dk-fs-s); color: var(--dk-muted); display: flex; gap: 8px; align-items: center; border: 1px dashed var(--dk-line); border-radius: 8px; padding: 4px 8px; }
.pline span { flex: 1; }
.pline select { min-width: 0; border: 1px solid var(--dk-line); border-radius: 6px; background: var(--dk-page); }
.pline.waiting { border-style: solid; border-color: var(--dk-mero); color: var(--dk-mero); }
.pc { display: flex; flex-direction: column; gap: 6px; padding: 9px 11px 10px; border: 1px solid var(--dk-line); border-top: 3px solid var(--dk-mero); border-radius: 10px; background: var(--dk-page); font-size: var(--dk-fs); }
.pc .ch { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: var(--dk-fs-s); }
.pc .ch .sp { flex: 1; }
.pc.pick { cursor: pointer; }
.pc.pick:hover { border-color: color-mix(in oklab, var(--dk-mero) 50%, var(--dk-line)); }
.pc.sel { background: color-mix(in oklab, var(--dk-mero) 14%, var(--dk-page)); border-color: var(--dk-mero); }
.pc .tick { width: 16px; height: 16px; flex: none; border: 1.5px solid var(--dk-line); border-radius: 4px; display: grid; place-items: center; font-size: 11px; color: var(--dk-page); }
.pc.sel .tick { background: var(--dk-mero); border-color: var(--dk-mero); color: var(--dk-on-mero); }
.pc .no, .pc .pk { font: var(--dk-fs-s) var(--dk-f-mono); color: var(--dk-muted); }
.pc .str { height: 18px; padding: 0 6px; display: inline-flex; align-items: center; border: 1px solid var(--dk-line); border-radius: 4px; font: 700 var(--dk-fs-xs)/1 var(--dk-f-body); color: var(--dk-muted); white-space: nowrap; }
.pc .from { font-size: var(--dk-fs-s); color: var(--dk-muted); }
.pc.hid { border-style: dashed; border-color: var(--dk-mero); }
.pc.peek .blur { filter: none; user-select: auto; }
.pstate { font-size: var(--dk-fs-s); border-radius: 7px; padding: 5px 8px; }
.pstate.wait { background: var(--dk-wait-soft); color: var(--dk-wait); } .pstate.good { background: var(--dk-good-soft); color: var(--dk-good); } .pstate.bad { background: var(--dk-bad-soft); color: var(--dk-bad); } .pstate.cast { background: var(--dk-mero-soft); color: var(--dk-mero); }
.pstate .q { border: 0; padding: 0; color: inherit; }
.pc ol.beats { margin: 0; padding-left: 20px; display: grid; gap: 3px; font-size: var(--dk-fs); }
.pc ol.beats li.done { color: var(--dk-muted); }
.pc ol.beats li.now { font-weight: 700; }
.pc ol.beats .bq { display: block; font-size: var(--dk-fs-s); font-style: italic; color: var(--dk-good); font-weight: 400; }
.pc .prog { height: 5px; border-radius: 3px; background: var(--dk-line); overflow: hidden; }
.pc .prog i { display: block; height: 100%; background: var(--dk-good); }
.pc .psets { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: var(--dk-fs-s); color: var(--dk-muted); }
.pc .psets select, .pc .psets input { border: 1px solid var(--dk-line); border-radius: 6px; background: var(--dk-page); font-size: var(--dk-fs-s); padding: 1px 4px; }
.pc .psets input { width: 46px; }
.pc .review { border: 1px dashed var(--dk-mero); border-radius: 8px; padding: 6px 8px; display: grid; gap: 4px; font-size: var(--dk-fs-s); }
.pc details summary { cursor: pointer; }
.pbusy { font-size: var(--dk-fs); color: var(--dk-mero); border: 1px dashed var(--dk-mero); border-radius: 10px; padding: 10px; }
.tn { display: flex; gap: 8px; align-items: center; min-height: 32px; font-size: var(--dk-fs); padding: 2px 8px; border-radius: 6px; }
.tn:hover { background: var(--dk-menu); }
.tn span:nth-child(2) { flex: 1; min-width: 0; cursor: text; }
.tn button { border: 0; background: none; color: var(--dk-muted); }
.tn input { flex: 1; min-width: 0; border: 1px solid var(--dk-accent); border-radius: 6px; padding: 0 4px; background: var(--dk-page); }
.pickhead { display: flex; align-items: center; gap: 6px; }
.pickhead h3 { flex: 1; min-width: 0; margin: 0; font: 700 var(--dk-fs-l)/1.2 var(--dk-f-display); }
/* the one menu for the picked pitches, at the bottom */
.actbar { position: sticky; bottom: -10px; margin: 0 -10px -10px; padding: 8px 10px 10px; display: grid; gap: 6px; background: var(--dk-page); border-top: 1px solid var(--dk-line); box-shadow: 0 -8px 18px rgba(0, 0, 0, .25); z-index: 4; }
.actbar .ah { display: flex; gap: 8px; align-items: center; font: 700 var(--dk-fs)/1.2 var(--dk-f-body); }
.actbar .ah span { flex: 1; }
.why { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; font-size: var(--dk-fs-s); }
.why > button { border: 1px solid var(--dk-line); background: var(--dk-page); border-radius: 999px; font-size: var(--dk-fs-s); padding: 0 8px; height: 22px; }
.why .whyrow { display: flex; gap: 6px; flex-basis: 100%; margin-top: 4px; }
.give { position: relative; display: inline-flex; }
.givemenu { position: absolute; bottom: calc(100% + 4px); left: 0; z-index: 6; background: var(--dk-page); border: 1px solid var(--dk-line); border-radius: 9px; box-shadow: var(--dk-shadow); padding: 4px; display: grid; min-width: 170px; max-height: 220px; overflow-y: auto; }
.givemenu button { border: 0; background: none; text-align: left; padding: 4px 8px; border-radius: 6px; font-size: var(--dk-fs); color: var(--dk-ink); }
.givemenu button:hover { background: var(--dk-mero-soft); }

/* 🎲 games (2026-10-27; mock-up https://claude.ai/artifact/138w9AchcDdmyuijzsLpoC) — the board stays put, her lines scroll under it */
.msgs.wd-on { overflow: hidden; }
.wd-pick { display: flex; flex-direction: column; gap: 8px; }
.wd-game { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 2px 10px; align-items: center; text-align: left; padding: 10px; border: 1px solid var(--dk-line); border-radius: 10px; background: var(--dk-page); color: var(--dk-ink); }
.wd-game:hover { border-color: var(--dk-mero); }
.wd-game .wd-ic { grid-row: 1 / 3; width: 44px; height: 44px; border-radius: 9px; background: var(--dk-good); color: var(--dk-on-mero); display: grid; place-items: center; font: 700 18px var(--dk-f-display); }
.wd-board { flex: none; align-self: center; width: 100%; max-width: 200px; display: grid; gap: 4px; }
.wd-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.wd-row.wd-shake { animation: wd-shake .3s; }
@keyframes wd-shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@media (prefers-reduced-motion: reduce) { .wd-row.wd-shake { animation: none; } }
.wd-t { aspect-ratio: 1; border: 2px solid var(--dk-line); border-radius: 6px; display: grid; place-items: center; font: 700 17px/1 var(--dk-f-display); text-transform: uppercase; }
.wd-t.f { border-color: var(--dk-line-strong); }
.wd-t.hit, .wd-k.hit { background: var(--dk-good); border-color: var(--dk-good); color: var(--dk-on-mero); }
.wd-t.near, .wd-k.near { background: var(--dk-wait); border-color: var(--dk-wait); color: var(--dk-on-mero); }
.wd-t.miss, .wd-k.miss { background: color-mix(in oklab, var(--dk-muted) 30%, var(--dk-page)); border-color: transparent; color: var(--dk-muted); }
.wd-says { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-top: 2px; }
.wd-says > * { flex-shrink: 0; }
.wd-foot { border-top: 1px solid var(--dk-line); padding: 8px 6px; display: flex; flex-direction: column; gap: 5px; }
.wd-tools { display: flex; gap: 6px; justify-content: space-between; align-items: center; padding: 0 4px; }
.wd-tl { display: flex; gap: 4px; }
/* the on-screen keys in a drawer on a PC (Miinthe, 2026-11-03: "make the keyboard in wordle to be in a drawer on PC") — shut at
   first there, you type anyway; ⌨ opens it (remembered in this browser). A phone keeps it open. */
#wd-kb { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .2s ease; }
#wd-kb > .wd-kin { min-height: 0; overflow: hidden; }
.wd-foot.kb-shut #wd-kb { grid-template-rows: 0fr; }
.wd-foot.kb-shut { gap: 0; }
#wd-keys[aria-expanded="true"] { color: var(--dk-ink); background: var(--dk-page); }
@media (prefers-reduced-motion: reduce) { #wd-kb { transition: none; } }
#wd-left { white-space: nowrap; }
.wd-type { align-self: center; border: 1px dashed var(--dk-line-strong); border-radius: 6px; background: none; color: var(--dk-muted); padding: 3px 8px; cursor: pointer; }
.wd-type:hover { color: var(--dk-ink); border-color: var(--dk-mero); }
#wd-talk[aria-pressed="false"] { color: var(--dk-muted); }
.wd-kr { display: flex; gap: 4px; justify-content: center; }
.wd-k { flex: 1 1 0; min-width: 0; max-width: 32px; height: 38px; border: 0; border-radius: 6px; padding: 0; background: var(--dk-line-strong); color: var(--dk-ink); font: 700 calc(12.5px * var(--fontScale, 1)) var(--dk-f-body); }
.wd-k.wide { flex: 1.6 1 0; max-width: 52px; font-size: var(--dk-fs-xs); }

/* 🎲 Four in a Row (2026-11-03): columns are buttons; her pieces gold, Mero's pink; the four that won get a ring */
.wd-game .wd-ic.f4i { background: var(--dk-mero); }
.f4 { flex: none; align-self: center; width: 100%; max-width: 250px; display: flex; flex-direction: column; gap: 3px; }
.f4-nums, .f4-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.f4-nums span { text-align: center; font-size: var(--dk-fs-xs); color: var(--dk-muted); }
.f4-nums span.hint { color: var(--dk-mero); font-weight: 700; }
.f4-grid { padding: 5px; border-radius: 10px; background: var(--dk-line-strong); }
.f4-col { display: grid; grid-template-rows: repeat(6, 1fr); gap: 3px; padding: 2px; border: 0; border-radius: 7px; background: none; cursor: pointer; overflow: hidden; }
.f4-col:disabled { cursor: default; }
.f4-col:hover:not(:disabled), .f4-col.hint { background: color-mix(in oklab, var(--dk-mero) 28%, transparent); }
.f4-col.full { animation: wd-shake .3s; }
.f4-c { aspect-ratio: 1; border-radius: 50%; background: var(--dk-page); }
.f4-c.f4r, .f4-dot.f4r { background: var(--dk-wait); }
.f4-c.f4m, .f4-dot.f4m { background: var(--dk-mero); }
.f4-c.win { box-shadow: inset 0 0 0 3px var(--dk-ink); }
.f4-c.new { animation: f4-drop .35s ease-in both; }
.f4-c.new.late { animation-delay: .4s; }
@keyframes f4-drop { from { transform: translateY(-500%); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .f4-c.new, .f4-col.full { animation: none; } }
.f4-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; }
.f4-key { text-align: center; }

/* the scroll bar on the panel's outer edge when the panel is on the left (Miinthe, 2026-11-03) */
body.pleft .msgs { direction: rtl; }
body.pleft .msgs > * { direction: ltr; }

/* "What Mero was told" */
.told { position: absolute; right: 12px; top: 12px; width: min(440px, calc(100% - 24px)); max-height: calc(100% - 24px); background: var(--dk-page); border: 1px solid var(--dk-line); border-radius: 12px; box-shadow: var(--dk-shadow); display: flex; flex-direction: column; z-index: 30; overflow: hidden; resize: both; }
.mwh { display: flex; gap: 8px; align-items: center; padding: 6px 6px 6px 12px; background: var(--dk-menu); border-bottom: 1px solid var(--dk-line); }
.mwh b { font: 700 var(--dk-fs)/1.2 var(--dk-f-display); flex: 1; }
.told-b { overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.told-b details { border: 1px solid var(--dk-line); border-radius: 8px; padding: 6px 10px; }
.told-b summary { cursor: pointer; display: flex; gap: 8px; font-size: var(--dk-fs); font-weight: 700; }
.told-b summary span:first-child { flex: 1; }
.told-b pre { white-space: pre-wrap; font: var(--dk-fs-s)/1.45 var(--dk-f-mono); margin: 6px 0 0; color: var(--dk-muted); }

              <div class="pr"><span>Visible</span><div class="seg" data-pk="vis"><button data-v="show">👁 visible</button><button data-v="hide">🙈 hidden</button></div></div>
              <div class="pr" id="pr-n"><span>How many</span><div class="seg" data-pk="n"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button></div></div>

          </div>

            <input type="text" id="po-goal" maxlength="300" placeholder="Where the plan is heading" aria-label="Where the plan is heading" hidden>
            <textarea id="po-text" rows="2" class="grow" maxlength="600" placeholder="Your idea" aria-label="Your idea"></textarea>
            <label class="inline" id="po-wait-l"><input type="checkbox" id="po-wait"> wait for a moment before it reaches the writer</label>

            </div>

          <p class="mini" id="pick-sub" style="margin:0"></p>
          <div class="stack" id="p-fresh"></div>
          <div class="vtools"><button class="btn ghost" id="pick-again" title="Throw these away and pitch again with the same settings"></button><span class="sp"></span><button class="btn ghost" id="pick-aside" title="Set the ones you didn't use or keep aside. They don't count as 👎, and ↩ Bring back returns them once.">Set them all aside</button></div>
        </div>
        <div class="actbar" id="actbar" hidden role="toolbar" aria-label="What to do with the picked pitches">
          <div class="ah"><span id="act-n"></span><button class="ib" data-b="clear" title="Unpick" aria-label="Unpick"></button></div>
          <div class="row" id="act-main">
            <button class="btn m2" data-b="dir" title="Goes to the writer with your next reply, hidden from the chat"></button>

            <span class="give"><button class="btn" data-b="givemenu" title="Make it one of their plans"></button><span class="givemenu" id="givemenu" hidden></span></span>

          <div class="why" id="act-why" hidden><span>👎 Why? (optional)</span><button data-why="too much">too much</button><button data-why="not like them">not like them</button><button data-why="not now">not now</button><button data-why="wrong tone">wrong tone</button><span class="whyrow"><button class="btn" data-why="" title="No reason needed">👎 Not my thing</button><button class="btn ghost" data-whycancel>Cancel</button></span></div>

    <nav class="rail" aria-label="Mero's drawers">
      <button class="ri" data-d="d-sess" aria-pressed="false" title="Talks" data-ic="talks"></button>

      <button class="ri" data-d="d-pitch" aria-pressed="false" title="Pitches and plans" data-ic="pitch"><span class="rdot" id="pitch-badge" hidden></span></button>

    </nav>
    <div class="told" id="told" hidden role="dialog" aria-label="What Mero was told"><div class="mwh" id="told-h"><b>What Mero was told</b><span class="mini">for her last answer</span><button class="ib" id="told-x" title="Close" aria-label="Close"></button></div><div class="told-b" id="told-b"></div></div>

<script type="module">
import { followTheme } from '../src/kit/theme.js';
import { icon as I } from '../src/kit/icons.js';
import { openMenu, notify, ask } from '../src/kit/kit.js';
import { talkLine, talkMenu, pitchLine } from '../src/panel/mero-view-pure.js';
followTheme(document);   // SillyTavern's live theme → the --dk-* colors (overhaul, 2026-10-15)
(() => {
  const HOST = window.parent?.__dleMeroHost;
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const toast = t => notify({ text: t, tone: 'mero', doc: document });
  const lbl = (el, ic, text) => { if (el) el.innerHTML = I(ic) + (text ? `<span>${esc(text)}</span>` : ''); };
  if (!HOST) { document.body.innerHTML = '<p style="padding:16px">Open this from Onyx Quill\'s side panel.</p>'; return; }
  // line icons (v13): words stay, emoji only for story things
  $$('.ri[data-ic]').forEach(b => b.insertAdjacentHTML('afterbegin', I(b.dataset.ic)));
  $$('[data-close], #told-x').forEach(b => { b.innerHTML = I('close'); });
  $('#s-told').innerHTML = I('info'); $('#s-more').innerHTML = I('more');
  lbl($('#c-pitch'), 'pitch', 'Pitch'); lbl($('#p-own-b'), 'edit', 'My own'); lbl($('#new-sess'), 'plus', 'New'); lbl($('#new-note'), 'plus', 'Note');
  lbl($('[data-tool="notebook"]'), 'book', 'Notebook'); lbl($('[data-tool="ai-notebook"]'), 'notes', 'AI notepad'); lbl($('[data-tool="scribe-history"]'), 'scribe', 'Scribe');
  lbl($('#pick-again'), 'refresh', 'New batch'); $('[data-b="clear"]').innerHTML = I('close'); $('[data-b="no"]').innerHTML = I('thumb');
  lbl($('[data-b="draft"]'), 'line', 'My line'); lbl($('[data-b="givemenu"]'), 'give', 'Give to…'); lbl($('[data-b="keep"]'), 'keep', 'Keep');

  const TAG = { yap: ['💭 Yapping', 'yap'], plan: ['🗺 Planning', 'plan'], fb: ['✋ Feedback', 'fb'], game: ['🎲 Games', 'game'] };
  const KIND = { dont: ['🚫', 'Don\'t', 'var(--dk-bad)'], steer: ['🧭', 'Steer', 'var(--dk-l5)'], idea: ['💡', 'Idea', 'var(--dk-l1)'], fact: ['📄', 'Fact', 'var(--dk-good)'] };
  const LAST = { flash: '⚡ the next reply', sticky: '📌 for a few replies', pinned: '📍 until removed' };
  const SCOPE = { chat: 'this chat', run: 'this run', char: 'the character — every chat', board: 'the board' };
  let D = HOST.load(), cur = null, sessFilter = 'all', sessQ = '';
  const OPEN = { 'sess-archived': false, 'notes-ended': false, 'req-done': false }, MORE = {};

  const fold = (key, title, items, { limit = 5, empty = '' } = {}) => {
    if (!items.length) return empty ? `<h4>${title}</h4><p class="mini">${empty}</p>` : '';
    const open = OPEN[key] !== false, all = MORE[key], shown = all ? items : items.slice(0, limit), rest = items.length - shown.length;
    return `<button class="foldh" data-fold="${key}" aria-expanded="${open}"><span class="ft">${title}</span><span class="cnt">${items.length}</span><span class="chev">▾</span></button>`
      + (open ? shown.join('') + (rest > 0 ? `<button class="btn ghost more" data-more="${key}">Show ${rest} more</button>` : all && items.length > limit ? `<button class="btn ghost more" data-more="${key}">Show fewer</button>` : '') : '');
  };
  document.addEventListener('click', e => {
    const f = e.target.closest('[data-fold]'), m = e.target.closest('[data-more]');
    if (f) OPEN[f.dataset.fold] = OPEN[f.dataset.fold] === false; else if (m) MORE[m.dataset.more] = !MORE[m.dataset.more]; else return;
    drawSessions(); drawNotes(); drawReqs(); drawPitches();
  });
  const linkTrackers = h => (D.trackers || []).reduce((t, n) => (n && t.includes(esc(n)) ? t.split(esc(n)).join(`<button class="tlink" data-story="${esc(n)}" title="Open the Story tab at ${esc(n)}">${esc(n)}</button>`) : t), h);
  const nl2br = h => h.replace(/\n/g, '<br>');
  /** **bold**, *italics*, _italics_ (Miinthe, 2026-11-02: the asterisks showed). Runs on already-escaped text, so it only adds <b>/<i>. */
  const md = h => h
    .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*\w])\*(?=[^\s*])([^*\n]*?[^\s*])\*(?![*\w])/g, '$1<i>$2</i>')
    .replace(/(^|[^\w])_(?=\S)([^_\n]*?\S)_(?!\w)/g, '$1<i>$2</i>');

  function pickTalk() {
    const talks = D.talks || [];
    cur = talks.find(t => t.id === cur?.id) || talks.find(t => t.state === 'open') || talks[0] || null;
  }
  function drawHead() {
    $('#s-line').textContent = talkLine({ character: D.where.character, connection: D.connection, state: cur?.state });
    if (!cur) { $('#s-title').textContent = D.where.charKey ? 'No talk yet' : 'Open a character chat'; $('#s-tag').hidden = true; $('#s-told').hidden = true; return; }
    $('#s-tag').hidden = false; $('#s-told').hidden = false;
    $('#s-title').innerHTML = `<span class="ttl" id="s-ttl" title="Click to rename">${esc(cur.title)}</span>${cur.mine ? '' : ' <span class="smart" title="Mero named it — rename it to make it yours">✨</span>'}`;
    $('#s-ttl').onclick = renameTalk;
    // the tag is Mero's to set as the talk goes — shown, never picked (Miinthe, 2026-11-02)
    const tg = $('#s-tag'); tg.textContent = TAG[cur.tag][0]; tg.className = 'kindsel ' + cur.tag;
    tg.title = cur.tag === 'game' ? 'A game' : 'Mero sorts the talk herself as it goes';
  }
  const cardHtml = (c, k, j) => `<div class="card" style="--kc:${KIND[c.kind][2]}"><div class="ch">📝 ${c.state === 'kept' ? 'Kept' : c.state === 'no' ? 'Not kept' : 'Keep this note?'} <small>from this talk</small>${c.state ? `<span class="cardstate${c.state === 'no' ? ' no' : ''}">${c.state === 'kept' ? '✓ in 📝 Notes' : ''}</span>` : ''}</div>
      <div>${KIND[c.kind][0]} <b>${esc(c.text)}</b></div>
      ${c.state ? '' : `<div class="row"><select aria-label="Kind" data-ck="${k}:${j}">${Object.entries(KIND).map(([v, x]) => `<option value="${v}"${v === c.kind ? ' selected' : ''}>${x[0]} ${x[1]}</option>`).join('')}</select>
        <select aria-label="How long" data-cl="${k}:${j}">${Object.entries(LAST).map(([v, x]) => `<option value="${v}"${v === c.last ? ' selected' : ''}>${x}</option>`).join('')}</select>
        <select aria-label="Where it applies" data-cs="${k}:${j}">${Object.entries(SCOPE).filter(([v]) => v !== 'run' || D.where.run).filter(([v]) => v !== 'board' || D.where.board).map(([v, x]) => `<option value="${v}"${v === c.scope ? ' selected' : ''}>${x}</option>`).join('')}</select></div>
      <div class="row"><button class="btn p" data-keep="${k}:${j}">${I('keep')}Keep</button><button class="btn ghost" data-no="${k}:${j}">No</button>${c.kind === 'dont' || c.kind === 'steer' ? `<button class="btn m2" data-redo="${k}:${j}" title="Keep it and swipe the last reply with it in force. The board's rolls and moves stay">${I('refresh')}Redo the last reply with this note</button>` : ''}</div>`}</div>`;
  // ── one message: its header (name, 🔎 lookups, ◀ ▶ swipes, ↻ ✏ 🗑), its text, the 💡 cards made from it ──
  const lookOpen = new Set();   // "talkid:k" — lookups unfolded
  let editing = null;           // { k, text } — her message being edited (text = what she typed so far: a redraw keeps it)
  let sure = null, sureAt = 0;  // "talkid:k" — 🗑 pressed: Delete / Keep showing (since sureAt)
  let pEditing = null;          // a pitch id being edited in the talk
  let pDraft = {};              // what she typed in that pitch's edit fields so far (a redraw keeps it)
  let shownTalk = null;         // the talk drawn last — another talk opened: 🗑 / ✏ never carry over (bug hunt 2026-11-03:
                                // an armed Delete followed her into the next talk and took its first message)
  const talkBusy = () => !!cur && (Array.isArray(D.busyIn) ? D.busyIn.includes(cur.id) : !!D.busy);   // Mero answering in THIS talk
  const askSel = {};            // "talkid:k" → [{ picked: Set, own }] — her picks on question cards not sent yet
  let lastSig = '';             // talk + message count the talk was last drawn with (scroll to the bottom only on news)
  const lastMero = () => { for (let k = cur.msgs.length - 1; k >= 0; k--) if (cur.msgs[k].who === 'mero') return k; return -1; };
  // your messages to Mero: the name she calls you, else just "You" (Miinthe, 2026-11-03: "default … should be 'you' (no names)")
  const myName = () => String(D.settings?.callMe || '').trim() || 'You';
  const lastAuthor = () => { for (let k = cur.msgs.length - 1; k >= 0; k--) if (cur.msgs[k].who === 'author') return k; return -1; };
  function msgHtml(m, k) {
    const mine = m.who === 'author', key = cur.id + ':' + k, busyNow = talkBusy() || !!PV().busy, armed = sure === key;

    const dropped = V.dropped || [];
    $('#p-dropped').hidden = !dropped.length;
    $('#p-dropped').innerHTML = dropped.length ? `<span>${dropped.length} pitch${dropped.length > 1 ? 'es' : ''} dropped.</span><button class="btn ghost" id="p-bring">↩ Bring back</button><button class="btn ghost" id="p-forget" title="Delete the dropped pitches for good">🗑 Delete ${dropped.length > 1 ? 'them' : 'it'}</button>` : '';
    const pf = $('#p-forget'); if (pf) pf.onclick = () => { HOST.pitchForgetDropped(); toast('Dropped pitches deleted.'); };
    const pb = $('#p-bring'); if (pb) pb.onclick = () => { pView = 'pick'; pickSel.clear(); HOST.pitchBringBack(); drawPitches(); };
    $('#p-out').innerHTML = pSec('p-out', 'Out in the story', list.filter(p => ['running', 'dir', 'skipped', 'draft', 'given', 'hidden', 'landed', 'played', 'fired', 'done', 'abandoned'].includes(p.st)));
    $('#p-kept').innerHTML = pSec('p-kept', '📌 Kept as ideas', list.filter(p => p.st === 'kept'));
    const taste = (D.notes || []).filter(n => n.taste);
    $('#p-taste').innerHTML = taste.length ? `<button class="foldh" id="taste-h" aria-expanded="${tasteOpen}" title="Mero adds a line when you use a pitch or 👎 one. Pitches never go against a 🚫 Don't note."><span class="ft">Your taste</span><span class="cnt">${taste.length}</span><span class="chev">▾</span></button>`
      + (tasteOpen ? `<div class="stack" style="gap:4px;margin-top:6px">${taste.map(n => `<div class="tn"><span>${n.taste === 'up' ? '👍' : '👎'}</span><span data-ted="${n.id}" title="Click to change">${esc(n.text)}</span><button data-trm="${n.id}" aria-label="Forget">✕</button></div>`).join('')}</div>` : '') : '';
    const th = $('#taste-h'); if (th) th.onclick = () => { tasteOpen = !tasteOpen; drawPitches(); };
    $$('[data-trm]').forEach(b => b.onclick = () => HOST.tasteEdit(b.dataset.trm, null));
    $$('[data-ted]').forEach(el => el.onclick = () => { const n = taste.find(x => x.id === el.dataset.ted); el.outerHTML = `<input id="te-in" value="${esc(n.text)}" aria-label="Taste note">`; const inp = $('#te-in'); inp.focus(); let fin = false; const done = ok => { if (fin) return; fin = true; if (ok && inp.value.trim() && inp.value.trim() !== n.text) HOST.tasteEdit(n.id, inp.value.trim()); else drawPitches(); }; inp.onkeydown = e => { if (e.key === 'Enter') done(true); if (e.key === 'Escape') done(false); }; inp.onblur = () => done(true); });
    // the pick view
    $('#pick-title').textContent = fresh.length ? `${fresh.length} ${fresh.length === 1 ? 'pitch' : 'pitches'} to pick from` : 'Pitches';
    $('#pick-sub').textContent = `${fromMsg != null ? `From message #${fromMsg}` : 'From the whole story'} · ${PS[m.str] || ''} · ${String(m.tone || 'sfw').toUpperCase()}`;
    $('#pick-again').disabled = !!V.busy; $('#pick-aside').disabled = !!V.busy || !fresh.length;
    $('#p-fresh').innerHTML = (V.busy === 'batch' ? `<div class="pbusy">${busyText}</div>` : '') + fresh.map(pCard).join('') + (V.busy === 'more' ? `<div class="pbusy">${busyText}</div>` : '');
    // cards
    $$('#pitch-db .pc.pick').forEach(c => {
      const flip = () => { const id = c.dataset.pid; pickSel.has(id) ? pickSel.delete(id) : pickSel.add(id); askWhy = false; drawPitches(); };
      c.onclick = e => { if (!e.target.closest('button')) flip(); };
      c.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } };
    });
    $$('#pitch-db [data-pa]').forEach(b => b.onclick = () => {
      const id = b.closest('[data-pid]').dataset.pid, a = b.dataset.pa;
      if (a === 'peek') HOST.pitchPeek(id, !pById(id)?.peek);
      else if (a === 'letgo') HOST.pitchLetGo(id);
      else if (a === 'putback') { const r = HOST.pitchPutBack(id); toast(r.ok ? '📝 Your line is back in the message box.' : r.error); }
      else if (a === 'takeback') { HOST.pitchTakeBack(id); toast('Taken back — it\'s with the kept ideas.'); }
      else if (a === 'abandon') { HOST.planAbandon(id); toast('🗑 Plan abandoned.'); }
      else if (a === 'linger') { HOST.planLinger(id); toast('⏳ Lingering — this beat takes a few more replies.'); }
      else if (a === 'ruse') { HOST.planUseReview(id); toast('🪜 The plan goes on with the new beats.'); }
      else if (a === 'rdrop') HOST.planDropReview(id);
      else if (a === 'extend' || a === 'redirect') { b.disabled = true; HOST.planRewrite(id, a).then(r => { if (!r.ok) toast(r.error); else toast('Mero suggests new beats — review them on the plan.'); }); }
    });
    $$('#pitch-db [data-pfloor]').forEach(i => i.onchange = () => HOST.planSet(i.closest('[data-pid]').dataset.pid, { floor: { k: +i.dataset.pfloor, n: +i.value } }));
    $$('#pitch-db [data-psees]').forEach(x => x.onchange = () => HOST.planSet(x.closest('[data-pid]').dataset.pid, { sees: x.value }));
    $$('#pitch-db [data-ptimer]').forEach(x => x.onchange = () => HOST.planSet(x.closest('[data-pid]').dataset.pid, { timer: +x.value }));
    drawActbar();
    const nb = fresh.length; $('#pitch-badge').hidden = !nb; $('.ri[data-d="d-pitch"]').title = nb ? `Pitches and plans (${nb} to pick from)` : 'Pitches and plans';
  }
  function drawActbar() {
    const picked = PV().list.filter(p => pickSel.has(p.id)), n = picked.length, one = n === 1 ? picked[0] : null;
    $('#actbar').hidden = !n;
    if (!n) return;
    $('#act-n').textContent = n === 1 ? `#${one.no} picked` : `${picked.map(p => '#' + p.no).join(' + ')} picked`;
    const single = n === 1 && one.kind !== 'ask', busy = !!PV().busy, plan = single && !!one.plan;
    for (const k of ['dir', 'draft', 'givemenu']) { const b = $(`#actbar [data-b="${k}"]`); b.disabled = !single || busy || (plan && k !== 'dir') || (k === 'givemenu' && !(PV().cast || []).length); b.title = !single ? (n > 1 ? 'Pick one — or 💬 talk about combining them' : 'A question — answer it in a talk') : plan && k !== 'dir' ? 'Not for a plan' : k === 'givemenu' && !(PV().cast || []).length ? 'No Cast on this board' : ''; }
    lbl($('#actbar [data-b="dir"]'), 'send', plan ? 'Start the plan' : 'Next reply');
    lbl($('#b-talk'), 'talks', n > 1 ? 'Talk about these' : one.kind === 'ask' ? 'Answer in a talk' : 'Talk about it');
    lbl($('#b-more'), 'refresh', n > 1 ? 'More like these' : 'More like it'); $('#b-more').disabled = busy;
    $('#act-hint').textContent = n > 1 ? 'Say in the talk how to combine them.' : '';
    $('#act-main').hidden = askWhy; $('#act-more').hidden = askWhy; $('#act-why').hidden = !askWhy;
    $('#givemenu').innerHTML = single ? (PV().cast || []).map(c => `<button data-give="${esc(c.cast)}|${esc(c.person)}">🎭 ${esc(c.name)}${c.name === one.who ? ' (fits best)' : ''}${c.here ? '' : ' <span class="mini">(away)</span>'}</button>`).join('') : '';
    $$('#givemenu [data-give]').forEach(b => b.onclick = () => {
      const [c, p] = b.dataset.give.split('|'); const r = HOST.pitchGive(one.id, c, p);
      pickSel.clear(); $('#givemenu').hidden = true;
      toast(r.ok ? `🎭 ${r.name} has a new plan.${r.dropped ? ` (Dropped their oldest: “${r.dropped}”.)` : ''}` : r.error);
    });
  }
  $$('#actbar [data-b]').forEach(b => b.onclick = async () => {
    const picked = PV().list.filter(p => pickSel.has(p.id)), ids = picked.map(p => p.id), p = picked[0], k = b.dataset.b;
    if (!p) return;
    if (k === 'givemenu') { $('#givemenu').hidden = !$('#givemenu').hidden; return; }
    if (k === 'clear') { pickSel.clear(); askWhy = false; drawPitches(); return; }
    if (k === 'no') { askWhy = true; drawActbar(); return; }
    if (k === 'dir' && p.plan) { const r = HOST.planStart(p.id); toast(r.ok ? `🪜 #${p.no} starts — the writer works toward beat 1.` : r.error); }
    else if (k === 'dir') { const r = HOST.pitchUse(p.id); toast(r.ok ? `✍️ #${p.no} goes with your next reply.` : r.error); }
    else if (k === 'keep') { HOST.pitchKeep(ids); toast(`📌 Kept: ${picked.map(x => '#' + x.no).join(' + ')}.`); }
    else if (k === 'draft') { pickSel.clear(); drawPitches(); const r = await HOST.pitchDraft(p.id); toast(r.ok ? '📝 Your line is in the message box — change it, then send.' : r.error); return; }
    else if (k === 'more') { pickSel.clear(); const r = await HOST.pitch({ like: ids, fromMsg }); if (!r.ok) toast(r.error); return; }
    else if (k === 'talk') {
      const opener = HOST.pitchTalk(ids);
      const t = HOST.newTalk('plan'); if (!t) { toast('Open a character chat first.'); return; }
      HOST.updateTalk(t.id, { title: picked.length > 1 ? `Pitches ${picked.map(x => '#' + x.no).join(' + ')}` : `Pitch #${p.no}` });
      cur = { ...t }; pickSel.clear(); refresh(); closeDrawers();
      $('#c-in').value = opener; autogrow($('#c-in')); $('#c-in').focus();
      return;
    }
    pickSel.clear(); drawPitches();
  });
  $('#act-why [data-whycancel]').onclick = () => { askWhy = false; drawActbar(); };
  $$('#act-why [data-why]').forEach(b => b.onclick = () => { const ids = [...pickSel]; HOST.pitchNo(ids, b.dataset.why); pickSel.clear(); askWhy = false; toast('👎 Noted — pitches learn your taste.'); });
  $$('.pmenu [data-pk]').forEach(g => g.addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.disabled) return; HOST.pitchMenu({ [g.dataset.pk]: g.dataset.pk === 'n' ? +b.dataset.v : b.dataset.v }); }));
  $('#psum').onclick = () => { const mm = $('#p-more'); mm.hidden = !mm.hidden; $('#psum').setAttribute('aria-expanded', String(!mm.hidden)); $('#psum-x').textContent = mm.hidden ? 'change ▾' : 'done ▴'; };
  $('#p-sees').onchange = e => HOST.pitchMenu({ sees: e.target.value });
  $('#p-timer').onchange = e => HOST.pitchMenu({ timer: +e.target.value });
  $('#p-moment').onchange = e => { if (e.target.value === 'mero') HOST.pitchMenu({ moment: '' }); else { $('#p-moment-t').hidden = false; $('#p-moment-t').focus(); } };
  $('#p-moment-t').onchange = e => HOST.pitchMenu({ moment: e.target.value.trim() });
  $('#p-fb').onchange = e => HOST.pitchMenu({ fbOn: e.target.checked });
  $('#p-fbn').onchange = e => HOST.pitchMenu({ fb: +e.target.value });
  async function goPitch() {
    const hid = PV().menu?.vis === 'hide';
    if (!hid) { pView = 'pick'; pickSel.clear(); }
    const comment = $('#p-com').value.trim();
    const r = await HOST.pitch({ comment, fromMsg });
    if (!r.ok) { toast(r.error); if (!hid) pView = 'home'; refresh(); return; }
    $('#p-com').value = ''; autogrow($('#p-com'));
    if (hid) toast(PV().menu?.shape === 'multi' ? '🎲 A hidden plan has started — the writer is led through it.' : '🎲 One hidden pitch is waiting for its moment.');
  }
  $('#p-go').onclick = goPitch;
  // ✏ My own (Miinthe, 2026-11-03: "manual pitches without going over Mero"): her idea straight into the list, no AI
  let poShape = 'one';
  function drawOwn() {
    const plan = poShape === 'multi', wait = !plan && $('#po-wait').checked;
    $$('#po-shape button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === poShape)));
    $('#po-goal').hidden = !plan; $('#po-wait-l').hidden = plan; $('#po-wait-box').hidden = !wait;
    $('#po-text').placeholder = plan ? 'One step per line, in order' : 'Your idea';
    $('#po-hint').textContent = plan ? 'Kept until you start it.' : wait ? 'Waits for that moment, then goes to the writer.' : 'Goes to your kept ideas.';
    $('#po-fbn').disabled = !$('#po-fb').checked;
    autogrow($('#po-text'));
  }
  function ownOpen(on) {
    $('#p-own').hidden = !on; $('#p-own-b').setAttribute('aria-expanded', String(on));
    if (on) { drawOwn(); setTimeout(() => (poShape === 'multi' ? $('#po-goal') : $('#po-text')).focus(), 30); }
  }
  $('#p-own-b').onclick = () => ownOpen($('#p-own').hidden);
  $('#po-cancel').onclick = () => ownOpen(false);
  $('#po-shape').onclick = e => { const b = e.target.closest('button'); if (!b) return; poShape = b.dataset.v; drawOwn(); };
  $('#po-wait').onchange = drawOwn; $('#po-fb').onchange = drawOwn;
  $('#po-add').onclick = () => {
    const plan = poShape === 'multi', wait = !plan && $('#po-wait').checked;
    if (wait && !$('#po-moment').value.trim()) { toast('Name the moment it waits for — or untick "wait for a moment".'); $('#po-moment').focus(); return; }
    const r = HOST.pitchOwn({ text: $('#po-text').value, plan, goal: $('#po-goal').value, moment: wait ? $('#po-moment').value : '', fb: wait && $('#po-fb').checked ? +$('#po-fbn').value || 10 : 0 });
    if (!r.ok) { toast(r.error); return; }
    $('#po-text').value = ''; $('#po-goal').value = ''; $('#po-moment').value = ''; $('#po-wait').checked = false;
    ownOpen(false);
    toast(r.waits ? `⏳ #${r.no} waits for its moment.` : r.plan ? `🪜 #${r.no} is with your kept ideas — pick it to start the plan.` : `✏ #${r.no} is with your kept ideas — pick it to send it out.`);
  };
  $('#p-own').addEventListener('keydown', e => { if (e.key === 'Escape') { e.stopPropagation(); ownOpen(false); } });
  $('#pick-again').onclick = goPitch;
  $('#pick-back').onclick = () => { HOST.pitchBack(); pickSel.clear(); pView = 'home'; drawPitches(); };
  $('#pick-aside').onclick = () => { HOST.pitchBack(); pickSel.clear(); pView = 'home'; drawPitches(); toast('Set aside. ↩ Bring back returns them once.'); };

  function refresh() {
    D = HOST.load();
    const popNow = !!D.popped && !document.body.classList.contains('wide');
    document.body.classList.toggle('wide', !!D.popped);
    document.body.classList.toggle('pleft', !D.popped && D.side === 'left');   // the rail follows the panel's side (v13)
    $('#pop-out').title = D.popped ? 'Back into the side panel' : 'Pop Mero out into her own window';
    $('#pop-out').innerHTML = I(D.popped ? (D.side === 'left' ? 'panelL' : 'panel') : 'popout');
    drawTalk(); drawSessions(); drawNotes(); drawSettings(); drawReqs(); drawPitches(); drawPitchBtn();
    // just popped out: the talks list beside the talk, the way her own window is meant to look
    if (popNow && $$('.drawer').every(d => d.hidden)) openD('d-sess', true);
    if (!cur && $$('.drawer').every(d => d.hidden)) goHome();   // no talk open: the list, never an empty talk
  }
  window.__meroRefresh = refresh;
  window.__meroOpenTalk = id => { D = HOST.load(); cur = (D.talks || []).find(t => t.id === id) || cur; refresh(); closeDrawers(); };   // 📚 a vault review
  window.__meroOpenTalks = () => { refresh(); openD('d-sess', true); };   // opening the talks marks the glow seen (openD)
  window.__meroOpenPitches = idx => { fromMsg = Number.isInteger(idx) ? idx : null; pView = 'home'; refresh(); openD('d-pitch', true); if (fromMsg != null) setTimeout(() => $('#p-com').focus(), 80); };
  window.__meroOpenRequests = () => { refresh(); if ($('#d-req').hidden) openD('d-req'); setTimeout(() => document.querySelector('#req-list .pill.now')?.closest('.card')?.scrollIntoView({ block: 'center', behavior: 'smooth' }), 80); };
  refresh();
})();
</script>
